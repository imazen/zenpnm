[package]
name = "zenbitmaps"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "PNM/PAM/PFM, BMP, farbfeld, QOI, TGA, and Radiance HDR image codec"
categories = ["multimedia::images"]
keywords = ["image", "pnm", "bmp", "tga", "qoi"]
repository = "https://github.com/imazen/zenbitmaps"
documentation = "https://docs.rs/zenbitmaps"
readme = "README.crates.md"
include = [
    "/src/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[dependencies]
# Core (always available)
enough = "0.4.3"
imgref = { version = "1.12", default-features = false, optional = true }
rgb = { version = "0.8", default-features = false, features = ["as-bytes"], optional = true }
thiserror = { version = "2.0", default-features = false }
whereat = { version = "0.1.5", default-features = false }
zencodec = { version = "0.1.26", optional = true }
# zennode is not yet published; uncomment when it's on crates.io
# zennode = { path = "../zennode/zennode", default-features = false, features = ["derive"], optional = true }
zenpixels = { version = "0.2.13", default-features = false, features = ["imgref"], optional = true }
# Load-bearing descriptor narrowing for the zencodec encode path — raw
# formats pay full price for dead lanes, so the reduction wins more here
# than for any entropy-coded codec.
zenpixels-convert = { version = "0.2.13", default-features = false, optional = true }
# SIMD acceleration
archmage = { version = "0.9.15", default-features = false, optional = true }
garb = { version = "0.2.5", default-features = false, optional = true }

[dev-dependencies]
archmage = { version = "0.9.14", features = ["std"] }
zenutils-fuzz = "0.1.0"
zenbench = "0.1.4"
# zencodec conformance harness (unpublished companion crate). Tag-pinned to the
# SAME zencodec release tag as the [patch.crates-io] below so both resolve to
# one unified zencodec. Provides check_decode_truncation_series (EOF/truncation).
# Drop for a crates.io version dep once zencodec-testkit itself publishes.
zencodec-testkit = { git = "https://github.com/imazen/zencodec", tag = "v0.1.26" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
codec-corpus = "1"

[features]
default = []
std = ["enough/std", "whereat/std"]

# Format groups
bmp = []   # Full BMP support (all bit depths, RLE, bitfields, palettes)
hdr = []   # Radiance HDR/RGBE format support
tga = []   # TGA (Targa) format support
qoi = []  # QOI codec (vendored core in src/qoi/rapid_qoi)
simd = ["dep:garb", "dep:archmage"]  # SIMD acceleration

# Typed pixel support
rgb = ["dep:rgb"]              # RGB8, RGBA8 etc. typed pixel encode/decode
imgref = ["dep:imgref", "rgb"] # ImgVec/ImgRef 2D buffer support (implies rgb)

# zencodec trait integration
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:zenpixels-convert", "imgref", "rgb"]

# zennode node definitions (EncodeBmp schema with RIAPI keys)
# Disabled until zennode is published to crates.io
# zennode = ["dep:zennode"]

# All optional features
all = ["bmp", "qoi", "tga", "hdr", "simd", "rgb", "imgref"]

[[bench]]
name = "codecs"
harness = false
required-features = ["bmp", "qoi", "tga", "hdr"]

[patch.crates-io]
# zencodec-testkit (dev-dependency above) is unpublished and its own manifest
# path-deps on zencodec within the same git checkout. Without this patch,
# crates.io zencodec (the [dependencies] entry above) and the testkit's
# path-embedded zencodec would resolve as two distinct crates, and every
# conformance test (tests/truncation_series.rs) would fail to compile with
# E0277 "multiple different versions of crate `zencodec`". This unifies the
# whole graph on the release tag, which is content-identical to the published
# 0.1.26 crate. Remove once zencodec-testkit itself ships on crates.io and the
# dev-dependency above switches to a version requirement.
zencodec = { git = "https://github.com/imazen/zencodec", tag = "v0.1.26" }

